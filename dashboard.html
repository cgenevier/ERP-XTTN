<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP-XTTN Benchmarking Dashboard</title>
<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-panel: #16213e;
  --bg-panel-alt: #1a2744;
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0b0;
  --accent: #4fc3f7;
  --accent-hover: #81d4fa;
  --border: #2a3a5e;
  --row-odd: #16213e;
  --row-even: #1a2744;
  --row-hover: #1e3050;
  --radius: 8px;
  --transition: 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 {
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--accent);
}
.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.header-status {
  font-size: 0.8rem;
  color: var(--text-secondary);
}
button {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 8px 18px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
}
button:hover {
  background: var(--accent);
  color: var(--bg-primary);
}
button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
button.btn-solid {
  background: var(--accent);
  color: var(--bg-primary);
  font-weight: 600;
}
button.btn-solid:hover {
  background: var(--accent-hover);
}
button.btn-small {
  padding: 4px 12px;
  font-size: 0.78rem;
}
button.btn-active {
  background: var(--accent);
  color: var(--bg-primary);
}
.tabs {
  display: flex;
  gap: 0;
  padding: 0 24px;
  background: var(--bg-panel);
  border-bottom: 2px solid var(--border);
}
.tab-btn {
  padding: 12px 24px;
  border: none;
  border-bottom: 3px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: color var(--transition), border-color var(--transition);
}
.tab-btn:hover {
  color: var(--text-primary);
  background: transparent;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.main {
  padding: 20px 24px;
  max-width: 1800px;
  margin: 0 auto;
}
.tab-panel {
  display: none;
}
.tab-panel.active {
  display: block;
}
.loading-overlay {
  display: none;
  padding: 32px;
  text-align: center;
}
.loading-overlay.active {
  display: block;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-list {
  list-style: none;
  max-width: 500px;
  margin: 16px auto;
  text-align: left;
}
.progress-list li {
  padding: 4px 0;
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.progress-list li.done { color: #66bb6a; }
.progress-list li.done::before { content: "\2713 "; }
.progress-list li.scanning { color: var(--accent); }
.progress-list li.scanning::before { content: "\25B6 "; }
.table-container {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-panel);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #0f1a30;
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--accent);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr:nth-child(odd) { background: var(--row-odd); }
tbody tr:nth-child(even) { background: var(--row-even); }
tbody tr:hover { background: var(--row-hover); }
tbody tr.clickable { cursor: pointer; }
.cell-missing {
  color: #666;
  font-style: italic;
}
.cell-best {
  font-weight: 700;
}
.auroc-cell {
  border-radius: 4px;
  padding: 4px 10px;
  display: inline-block;
  font-variant-numeric: tabular-nums;
}
.detail-row td {
  padding: 0;
  background: #0f1528 !important;
}
.detail-inner {
  padding: 12px 20px 16px;
  overflow-x: auto;
}
.detail-inner table {
  font-size: 0.82rem;
}
.detail-inner thead th {
  background: #0f1a30;
}
.filter-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-bar label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-right: 4px;
}
.controls-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 20px;
}
.control-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-group label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.control-group select {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-primary);
  min-width: 180px;
}
.fig-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 16px;
}
.fig-card {
  background: var(--bg-panel-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--transition);
}
.fig-card:hover {
  border-color: var(--accent);
}
.fig-card img {
  width: 100%;
  display: block;
  background: #111;
}
.fig-card .fig-label {
  padding: 6px 12px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
}
.fig-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.no-fig {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  background: var(--bg-panel-alt);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 0.9rem;
}
/* ── Validation tab ── */
.val-card {
  background: var(--bg-panel-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.val-head { font-size: 1.02rem; margin-bottom: 8px; }
.val-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.val-chip {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid; border-radius: 999px;
  padding: 3px 10px; font-size: 0.82rem; font-weight: 500;
  background: rgba(0,0,0,0.15);
}
.val-chip b { font-size: 0.9rem; }
.val-detail { margin-top: 10px; }
.val-detail summary {
  cursor: pointer; color: var(--accent); font-size: 0.85rem;
  padding: 4px 0; user-select: none;
}
.val-detail-body { padding-top: 10px; }
.val-ladder {
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  margin-bottom: 12px;
}
.val-ladder-legend { font-size: 0.84rem; line-height: 1.5; min-width: 180px; flex: 1; }
.val-metrics { width: 100%; border-collapse: collapse; font-size: 0.85rem; max-width: 460px; }
.val-metrics td { padding: 3px 8px; border-bottom: 1px solid var(--border); }
.val-metrics tr.val-grp td {
  color: var(--accent); font-weight: 600; font-size: 0.8rem;
  text-transform: uppercase; letter-spacing: 0.03em;
  padding-top: 10px; border-bottom: 1px solid var(--accent);
}
.compare-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 16px;
}
.compare-panel {
  background: var(--bg-panel-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.compare-panel .panel-header {
  padding: 8px 14px;
  background: #0f1a30;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
}
.compare-panel img {
  width: 100%;
  display: block;
  background: #111;
}
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.88);
  justify-content: center;
  align-items: center;
  padding: 24px;
}
.lightbox.active {
  display: flex;
}
.lightbox img {
  max-width: 95vw;
  max-height: 92vh;
  border-radius: 4px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.lightbox-close {
  position: fixed;
  top: 16px;
  right: 24px;
  z-index: 1001;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;
  padding: 4px 12px;
}
.lightbox-close:hover {
  color: var(--accent);
  background: transparent;
}
@media (max-width: 900px) {
  .fig-grid {
    grid-template-columns: 1fr;
  }
  .fig-pair {
    grid-template-columns: 1fr 1fr;
  }
  .compare-grid {
    grid-template-columns: 1fr;
  }
  .header { padding: 12px 16px; }
  .main { padding: 16px; }
  /* Tabs never overflow the viewport — they scroll horizontally instead. */
  .tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 0 0 auto; white-space: nowrap; }
}
@media (max-width: 600px) {
  body { -webkit-text-size-adjust: 100%; }
  /* Header stacks: title over actions, both left-aligned. */
  .header { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
  .header h1 { font-size: 1.15rem; }
  .header-actions { flex-wrap: wrap; }
  .header-status { font-size: 0.72rem; }
  .tabs { padding: 0 8px; }
  .tab-btn { padding: 10px 14px; font-size: 0.82rem; }
  .main { padding: 12px 10px; }
  /* Stack figure pairs/grids and the side-by-side compare panels. */
  .fig-pair, .fig-grid { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
  /* Full-width, tap-friendly selects. */
  .controls-row { gap: 10px; }
  .control-group { flex: 1 1 100%; }
  .control-group select { min-width: 0; width: 100%; }
  /* Tables still scroll inside .table-container; tighten cells for phone. */
  table { font-size: 0.8rem; }
  thead th, tbody td { padding: 7px 10px; }
  .detail-inner { padding: 10px 12px 12px; }
  button { padding: 7px 12px; font-size: 0.8rem; }
  button.btn-small { padding: 4px 10px; }
  .lightbox { padding: 10px; }
  .lightbox img { max-width: 98vw; max-height: 88vh; }
  .lightbox-close { top: 8px; right: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>ERP-XTTN Benchmarking Dashboard</h1>
  <div class="header-actions">
    <span id="sourceStatus" class="header-status"></span>
    <button id="btnSelectRepo" class="btn-small" style="display:none;">Select Repo Folder</button>
    <button id="btnRefresh" class="btn-solid" disabled>Refresh</button>
  </div>
</div>

<input id="repoPicker" type="file" webkitdirectory multiple hidden>

<div class="tabs">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="figures">Figures</button>
  <button class="tab-btn" data-tab="compare">Compare</button>
  <button class="tab-btn" data-tab="analysis">Analysis</button>
  <button class="tab-btn" data-tab="ablations">Ablations</button>
  <button class="tab-btn" data-tab="validation">Validation</button>
</div>

<div class="main">
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div>Scanning datasets...</div>
    <ul id="progressList" class="progress-list"></ul>
  </div>

  <div id="panelOverview" class="tab-panel active">
    <div id="filterBar" class="filter-bar"></div>
    <div id="overviewContent"></div>
  </div>

  <div id="panelFigures" class="tab-panel">
    <div id="figControls" class="controls-row"></div>
    <div id="figContent"></div>
  </div>

  <div id="panelCompare" class="tab-panel">
    <div id="compareControls" class="controls-row"></div>
    <div id="compareContent"></div>
  </div>

  <div id="panelAnalysis" class="tab-panel">
    <div id="analysisControls" class="controls-row"></div>
    <div id="analysisContent"></div>
  </div>

  <div id="panelAblations" class="tab-panel">
    <div id="ablationsContent"></div>
  </div>
  <div id="panelValidation" class="tab-panel">
    <div id="validationContent"></div>
  </div>
</div>

<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="Full-size figure">
</div>

<script>
/* ── State ── */
let allData = [];
let localFiles = null;
let localObjectUrls = new Map();
const IS_FILE_PROTOCOL = window.location.protocol === 'file:';
const CAN_PICK_DIRECTORIES = typeof window.showDirectoryPicker === 'function';

// Jupyter auth: extract token from URL and append to all fetch/img requests
const _urlParams = new URLSearchParams(window.location.search);
const _jupyterToken = _urlParams.get('token') || '';
function authUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return _jupyterToken ? path + sep + 'token=' + _jupyterToken : path;
}

const KNOWN_MODELS = ['erpxttn_peak', 'eegnet', 'eeg_deformer', 'epmn', 'epmn_native', 'xdawn_rg'];
// Seeds probed per model. Neural models sweep 1..5; xDAWN+RG is deterministic
// (seed-1 only). Missing seed dirs are simply skipped.
const SEED_CANDIDATES = [1, 2, 3, 4, 5];
const EXPECTED_SEEDS = (m) => (m === 'xdawn_rg' ? 1 : 5);
function modelDisplay(m) {
  if (m === 'eegnet') return 'EEGNet';
  if (m === 'eeg_deformer') return 'EEG-Deformer';
  if (m === 'epmn') return 'EPMN';
  if (m === 'epmn_native') return 'EPMN (native)';
  if (m === 'erpxttn_peak') return 'ERP-XTTN';
  if (m === 'xdawn_rg') return 'xDAWN+RG';
  return m;
}
const MODEL_DISPLAY = Object.fromEntries(KNOWN_MODELS.map(m => [m, modelDisplay(m)]));
const AGGREGATE_FIGS = [
  'fig_morphology_aggregate.png',
  'fig_prototypes.png',
  'fig_entropy_vs_auroc.png',
  'fig_attn_timecourse.png',
  'fig_attn_diff_overlay.png',
  'fig_per_subject_routing.png'
];

/* ── Tabs ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel' + capitalize(btn.dataset.tab)).classList.add('active');
    if (btn.dataset.tab === 'analysis') {
      // Lazy-build controls once, then render
      if (!document.getElementById('analVarBtns')) renderAnalysisControls();
      renderAnalysis();
    }
    if (btn.dataset.tab === 'ablations') {
      renderAblations();
    }
    if (btn.dataset.tab === 'validation') {
      renderValidation();
    }
  });
});

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ── Loading ── */
function showLoading(on) {
  document.getElementById('loadingOverlay').classList.toggle('active', on);
}

/* ── Lightbox ── */
function openLightbox(url) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = url;
  lb.classList.add('active');
}

document.getElementById('lightboxClose').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lightboxImg').src = '';
});

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
  }
});

/* ── Data Loading via direct file probing ── */

// All known dataset directory names
const KNOWN_DATASETS = [
  'bnci_errp_013-2015',
  'hri_errp_cursor',
  'erpcore_ern',
  'erpcore_lrp',
  'erpcore_mmn',
  'erpcore_n170',
  'erpcore_n2pc',
  'erpcore_n400',
  'erpcore_p300'
];

// Derive base path from dashboard URL
const _dashPath = window.location.pathname;
const _baseUrl = _dashPath.substring(0, _dashPath.lastIndexOf('/') + 1);

function setSourceStatus(message, tone) {
  const el = document.getElementById('sourceStatus');
  el.textContent = message || '';
  if (tone === 'warning') {
    el.style.color = '#ffa726';
  } else if (tone === 'ok') {
    el.style.color = '#66bb6a';
  } else {
    el.style.color = 'var(--text-secondary)';
  }
}

function clearLocalObjectUrls() {
  for (const url of localObjectUrls.values()) {
    URL.revokeObjectURL(url);
  }
  localObjectUrls.clear();
}

function indexLocalFiles(files) {
  const indexed = new Map();
  const prefixes = ['datasets/'];
  const keepFile = (relPath) => {
    if (relPath.startsWith('datasets/')) {
      return relPath.endsWith('/dataset_config.json') ||
        relPath.includes('/results/') && (relPath.endsWith('.json') || relPath.endsWith('.png'));
    }
    return false;
  };

  for (const file of files) {
    const rawPath = (file.webkitRelativePath || file.name || '').replace(/\\/g, '/');
    if (!rawPath) continue;

    let matched = false;
    for (const prefix of prefixes) {
      const idx = rawPath.indexOf(prefix);
      if (idx !== -1) {
        const relPath = rawPath.slice(idx);
        if (keepFile(relPath)) {
          indexed.set(relPath, file);
        }
        matched = true;
        break;
      }
    }

    if (!matched) {
      if (rawPath.endsWith('/dashboard.html')) {
        indexed.set('dashboard.html', file);
      } else if (rawPath.endsWith('/analysis_summary.json')) {
        indexed.set('analysis_summary.json', file);
      }
    }
  }

  return indexed;
}

async function safeGetDirectoryHandle(parent, name) {
  try {
    return await parent.getDirectoryHandle(name);
  } catch {
    return null;
  }
}

async function safeGetFileHandle(parent, name) {
  try {
    return await parent.getFileHandle(name);
  } catch {
    return null;
  }
}

async function addIndexedFile(indexed, relPath, fileHandle) {
  try {
    indexed.set(relPath, await fileHandle.getFile());
  } catch {
    // Ignore unreadable files and keep scanning.
  }
}

async function scanHandleTree(indexed, dirHandle, prefix, extensions) {
  for await (const entry of dirHandle.values()) {
    const relPath = prefix + entry.name;
    if (entry.kind === 'file') {
      if (extensions.some(ext => relPath.endsWith(ext))) {
        await addIndexedFile(indexed, relPath, entry);
      }
      continue;
    }
    await scanHandleTree(indexed, entry, relPath + '/', extensions);
  }
}

async function indexRepoHandle(rootHandle) {
  const indexed = new Map();

  const datasetsDir = await safeGetDirectoryHandle(rootHandle, 'datasets');
  if (datasetsDir) {
    for (const datasetName of KNOWN_DATASETS) {
      const datasetDir = await safeGetDirectoryHandle(datasetsDir, datasetName);
      if (!datasetDir) continue;

      const cfgHandle = await safeGetFileHandle(datasetDir, 'dataset_config.json');
      if (cfgHandle) {
        await addIndexedFile(indexed, 'datasets/' + datasetName + '/dataset_config.json', cfgHandle);
      }

      const resultsDir = await safeGetDirectoryHandle(datasetDir, 'results');
      if (resultsDir) {
        await scanHandleTree(indexed, resultsDir, 'datasets/' + datasetName + '/results/', ['.json', '.png']);
      }
    }
  }

  // Repo-level analysis summary
  const analysisHandle = await safeGetFileHandle(rootHandle, 'analysis_summary.json');
  if (analysisHandle) {
    await addIndexedFile(indexed, 'analysis_summary.json', analysisHandle);
  }

  return indexed;
}

function getLocalFile(relPath) {
  return localFiles ? (localFiles.get(relPath) || null) : null;
}

function getLocalFileUrl(relPath) {
  const file = getLocalFile(relPath);
  if (!file) return null;
  if (!localObjectUrls.has(relPath)) {
    localObjectUrls.set(relPath, URL.createObjectURL(file));
  }
  return localObjectUrls.get(relPath);
}

async function readTextFile(relPath) {
  const file = getLocalFile(relPath);
  if (!file) return null;
  try {
    return await file.text();
  } catch {
    return null;
  }
}

function renderLocalPrompt() {
  const message = 'Open locally: click Select Repo Folder and choose the ERP-XTTN repo root.';
  document.getElementById('filterBar').innerHTML = '';
  document.getElementById('overviewContent').innerHTML =
    '<div class="no-fig">' + message + '</div>';
  document.getElementById('figControls').innerHTML = '';
  document.getElementById('figContent').innerHTML =
    '<div class="no-fig">' + message + '</div>';
  document.getElementById('compareControls').innerHTML = '';
  document.getElementById('compareContent').innerHTML =
    '<div class="no-fig">' + message + '</div>';
}

function fileUrl(relPath) {
  if (localFiles) {
    return getLocalFileUrl(relPath);
  }
  return authUrl(_baseUrl + relPath);
}

async function fetchJson(relPath) {
  if (localFiles) {
    const text = await readTextFile(relPath);
    if (!text) return null;
    try {
      return JSON.parse(text);
    } catch {
      return null;
    }
  }
  try {
    const resp = await fetch(fileUrl(relPath));
    if (!resp.ok) return null;
    return await resp.json();
  } catch { return null; }
}


function _mean(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
// Headline AUROC for the overview table: fusion (two-factor) when the model has it
// (ERP-XTTN), else the plain routing/test AUROC (baselines). Keeps best-model
// selection and coloring on a like-for-like "headline number" basis.
function headlineAuroc(r) {
  if (!r) return null;
  return r.mean_two_factor != null ? r.mean_two_factor : r.mean_auroc;
}
function _std(a) {
  if (a.length < 2) return 0;
  const m = _mean(a);
  return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1));
}

// Aggregate per-seed results.json into one results object: each subject's
// AUROC/bal-acc is averaged over the available seeds. Adds _seedInfo for the
// progress/status display.
function aggregateSeeds(seedResults, expectedSeeds) {
  const bySubj = new Map();
  let elapsed = 0;
  for (const { results } of seedResults) {
    if (results.elapsed_seconds != null) elapsed += results.elapsed_seconds;
    // Two-factor (fusion) AUROC is stored per-subject at the top level, not per fold.
    const tfMap = results.two_factor_auroc_per_subject || {};
    for (const f of (results.folds || [])) {
      if (!bySubj.has(f.test_subject)) bySubj.set(f.test_subject, { a: [], b: [], tf: [] });
      const e = bySubj.get(f.test_subject);
      if (f.test_auroc != null) e.a.push(f.test_auroc);
      if (f.test_bal_acc != null) e.b.push(f.test_bal_acc);
      if (tfMap[f.test_subject] != null) e.tf.push(tfMap[f.test_subject]);
    }
  }
  const folds = [];
  for (const [subj, e] of bySubj) {
    folds.push({
      test_subject: subj,
      test_auroc: e.a.length ? _mean(e.a) : null,
      two_factor_auroc: e.tf.length ? _mean(e.tf) : null,
      test_bal_acc: e.b.length ? _mean(e.b) : null,
      n_seeds: e.a.length,
    });
  }
  const aurocs = folds.map(f => f.test_auroc).filter(v => v != null);
  const tfs = folds.map(f => f.two_factor_auroc).filter(v => v != null);
  // Per-seed dataset-mean AUROC (seed stability).
  const seedMeans = seedResults.map(sr => {
    const a = (sr.results.folds || []).map(f => f.test_auroc).filter(v => v != null);
    return a.length ? _mean(a) : null;
  }).filter(v => v != null);
  const seedsPresent = seedResults.map(s => s.seed).sort((x, y) => x - y);
  return {
    mean_auroc: aurocs.length ? _mean(aurocs) : null,
    std_auroc: aurocs.length > 1 ? _std(aurocs) : 0,
    // Seed-averaged fusion (two-factor) headline; null for models without it (baselines).
    mean_two_factor: tfs.length ? _mean(tfs) : null,
    std_two_factor: tfs.length > 1 ? _std(tfs) : 0,
    folds: folds,
    elapsed_seconds: elapsed || null,
    _seedInfo: {
      seedsPresent: seedsPresent,
      nSeeds: seedsPresent.length,
      expectedSeeds: expectedSeeds,
      complete: seedsPresent.length >= expectedSeeds,
      seedMean: seedMeans.length ? _mean(seedMeans) : null,
      seedSd: seedMeans.length > 1 ? _std(seedMeans) : 0,
      foldsPerSeed: seedResults.map(s => (s.results.folds || []).length),
    },
  };
}

async function ablAuroc(dir, variantDir, modelDir, metric) {
  const base = 'datasets/' + dir + '/results/tmin0ms_tmax800ms/' + variantDir + '/' + modelDir;
  const bySubj = {};
  const seedMeans = [];
  let nSeeds = 0;
  // Fetch all seeds concurrently (missing seeds return null, not a hang).
  const seedResults = await Promise.all(
    SEED_CANDIDATES.map(seed => fetchJson(base + '/seed-' + seed + '/results.json'))
  );
  for (const r of seedResults) {
    if (!r) continue;
    const a = [];
    if (metric === 'fusion' && r.two_factor_auroc_per_subject) {
      // Stage-2 fusion headline (base / nowhiten / Tier-2 / amp_only).
      for (const [subj, v] of Object.entries(r.two_factor_auroc_per_subject)) {
        if (v != null) { (bySubj[subj] = bySubj[subj] || []).push(v); a.push(v); }
      }
    } else {
      // Model's own forward AUROC (e2e / learned_readout / routing-only).
      for (const f of (r.folds || [])) {
        if (f.test_auroc != null) {
          (bySubj[f.test_subject] = bySubj[f.test_subject] || []).push(f.test_auroc);
          a.push(f.test_auroc);
        }
      }
    }
    if (a.length) { nSeeds++; seedMeans.push(_mean(a)); }
  }
  const perSubj = Object.values(bySubj).map(v => _mean(v));
  return {
    mean: perSubj.length ? _mean(perSubj) : null,
    sd: perSubj.length > 1 ? _std(perSubj) : 0,
    nSubjects: perSubj.length, nSeeds,
    seedSd: seedMeans.length > 1 ? _std(seedMeans) : 0,
  };
}

// Fetch validation.json across seeds; return each aggregate metric's seed-averaged mean.
async function valAgg(dir, variantDir) {
  const base = 'datasets/' + dir + '/results/tmin0ms_tmax800ms/' + variantDir + '/erpxttn_peak';
  const seedResults = await Promise.all(
    SEED_CANDIDATES.map(seed => fetchJson(base + '/seed-' + seed + '/validation.json'))
  );
  const acc = {}, seeds = [];
  let foldsPerSeed = [];
  for (let i = 0; i < seedResults.length; i++) {
    const r = seedResults[i];
    if (!r || !r.aggregate) continue;
    seeds.push(SEED_CANDIDATES[i]);
    foldsPerSeed.push(r.n_folds || null);
    for (const [k, v] of Object.entries(r.aggregate)) {
      if (v && typeof v === 'object' && typeof v.mean === 'number') {
        (acc[k] = acc[k] || []).push(v.mean);
      }
    }
  }
  if (!seeds.length) return null;
  const agg = {};
  for (const [k, arr] of Object.entries(acc)) agg[k] = _mean(arr);
  return {agg, nSeeds: seeds.length, seedsPresent: seeds, foldsPerSeed};
}

// Grounding pass/warn/fail logic. A dataset whose routing barely clears chance is a
// "floor" case: the collapse tests can't demonstrate anything on signal that isn't
// there, so those badges become ⚠ (informative-null), not ✗.
function valChecks(a) {
  const routing = a.routing_auroc;
  const floor = routing == null || routing < 0.58;   // near-chance decoding
  function grade(v, passAt, warnAt, higherBetter) {
    // higherBetter: PASS when v >= passAt. else (lower better): PASS when v <= passAt.
    if (higherBetter) return v >= passAt ? 'pass' : (v >= warnAt ? 'warn' : 'fail');
    return v <= passAt ? 'pass' : (v <= warnAt ? 'warn' : 'fail');
  }
  const checks = {};
  // 1. Routing decodes above chance.
  checks.routing = routing == null ? 'na' : (routing >= 0.62 ? 'pass' : (routing >= 0.55 ? 'warn' : 'fail'));
  // 2. Template load-bearing: polarity swap collapses AUROC (ideally below chance).
  const collapse = (a.ladder_intact != null && a.ladder_polarity != null)
    ? a.ladder_intact - a.ladder_polarity : null;
  checks.ladder = floor ? 'warn' : (collapse == null ? 'na' : grade(collapse, 0.15, 0.05, true));
  // 3. Carrier scramble -> chance (waveform shape, not spectral artifact).
  const carrierDev = Math.max(Math.abs((a.carrier_peak_proto ?? 0.5) - 0.5),
                              Math.abs((a.carrier_trial ?? 0.5) - 0.5));
  checks.carrier = grade(carrierDev, 0.05, 0.10, false);
  // 4. Amplitude localizes in time: on-window beats early-baseline window.
  const ampGain = (a.amp_channel_on != null && a.amp_channel_baseline != null)
    ? a.amp_channel_on - a.amp_channel_baseline : null;
  checks.amploc = floor ? 'warn' : (ampGain == null ? 'na' : grade(ampGain, 0.08, 0.03, true));
  // 5. Amplitude channel-specific: permuting channel assignment returns to chance.
  const permDev = a.amp_channel_permute != null ? a.amp_channel_permute - 0.5 : null;
  checks.ampspec = floor ? 'warn' : (permDev == null ? 'na' : grade(permDev, 0.05, 0.10, false));
  return {checks, floor};
}

function valChip(label, state) {
  const C = {pass: '#66bb6a', warn: '#ffb74d', fail: '#ef5350', na: '#5a6a80'};
  const I = {pass: '✓', warn: '⚠', fail: '✗', na: '·'};
  const c = C[state] || C.na;
  return '<span class="val-chip" style="border-color:' + c + ';color:' + c + ';">'
    + '<b>' + I[state] + '</b> ' + label + '</span>';
}

// Compact ladder mini-chart: intact -> polarity -> cross, chance line at 0.5.
// Grounded (solid) should dive below chance; learned free head (dashed) stays flat.
function ladderSvg(g, l) {
  const W = 240, H = 96, padL = 30, padR = 8, padT = 8, padB = 18;
  const x = i => padL + i * ((W - padL - padR) / 2);
  const y = v => padT + (1 - v) * (H - padT - padB);
  const rungs = ['intact', 'polarity', 'cross'];
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:280px;">';
  // axis + chance line
  s += '<line x1="' + padL + '" y1="' + y(0.5) + '" x2="' + (W - padR) + '" y2="' + y(0.5)
    + '" stroke="#5a6a80" stroke-dasharray="3 3" stroke-width="1"/>';
  s += '<text x="2" y="' + (y(0.5) + 3) + '" fill="#5a6a80" font-size="8">.5</text>';
  s += '<text x="2" y="' + (y(1.0) + 6) + '" fill="#5a6a80" font-size="8">1</text>';
  s += '<text x="2" y="' + y(0.0) + '" fill="#5a6a80" font-size="8">0</text>';
  function poly(vals, color, dash) {
    const pts = vals.map((v, i) => v == null ? null : x(i) + ',' + y(v)).filter(Boolean);
    if (pts.length < 1) return '';
    let o = '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color
      + '" stroke-width="1.6"' + (dash ? ' stroke-dasharray="4 3"' : '') + '/>';
    vals.forEach((v, i) => { if (v != null) o += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.4" fill="' + color + '"/>'; });
    return o;
  }
  s += poly(rungs.map(r => g[r]), '#4fc3f7', false);      // grounded
  if (l) s += poly([l.intact, l.polarity, l.cross], '#ffb74d', true);  // learned free head
  ['intact', 'swap', 'cross'].forEach((lab, i) =>
    s += '<text x="' + x(i) + '" y="' + (H - 5) + '" fill="#a0a0b0" font-size="8" text-anchor="middle">' + lab + '</text>');
  s += '</svg>';
  return s;
}

          + '</b> <span style="color:var(--text-secondary);">— no grounding run yet</span></div></div>';
        continue;
      }
      any = true;
      const a = v.agg;
      const {checks, floor} = valChecks(a);
      const routingTxt = a.routing_auroc != null ? a.routing_auroc.toFixed(3) : '—';
      const floorTag = floor ? ' <span style="color:#ffb74d;font-size:0.8rem;">floor (routing≈chance)</span>' : '';
      let head = '<div class="val-head"><b>' + ds.label + '</b> '
        + '<span style="color:var(--text-secondary);font-size:0.85rem;">routing AUROC '
        + '<span style="color:' + aurocColor(a.routing_auroc) + ';font-weight:600;">' + routingTxt + '</span>'
        + ' · fusion ' + (a.two_factor != null ? a.two_factor.toFixed(3) : '—')
        + ' · ' + v.nSeeds + ' seed' + (v.nSeeds === 1 ? '' : 's') + '</span>' + floorTag + '</div>';
      let chips = '<div class="val-badges">'
        + valChip('Routing', checks.routing) + valChip('Ladder', checks.ladder)
        + valChip('Carrier', checks.carrier) + valChip('Amp loc', checks.amploc)
        + valChip('Amp spec', checks.ampspec) + '</div>';

      // Layer 2 + 3 in an expandable.
      const ladderG = {intact: a.ladder_intact, polarity: a.ladder_polarity, cross: a.ladder_cross};
      let detail = '<details class="val-detail"><summary>swap ladder &amp; all metrics</summary>'
        + '<div class="val-detail-body">';
      detail += '<div class="val-ladder"><div>' + ladderSvg(ladderG, learned) + '</div>'
        + '<div class="val-ladder-legend"><div><span style="color:#4fc3f7;">━</span> grounded readout (Σ a·m)</div>'
        + (learned ? '<div><span style="color:#ffb74d;">╌</span> learned free head (' + learned.nSeeds + ' seed'
            + (learned.nSeeds === 1 ? '' : 's') + ')</div>'
            + '<div style="color:var(--text-secondary);font-size:0.78rem;margin-top:4px;">The free head ignores <i>m</i>, '
            + 'so its ladder stays flat under template swaps — the grounded line collapses below chance.</div>'
          : '<div style="color:var(--text-secondary);font-size:0.78rem;">learned free head not run on this dataset</div>')
        + '</div></div>';
      // Full metric table.
      detail += '<table class="val-metrics">';
      for (const grp of VAL_METRIC_GROUPS) {
        detail += '<tr class="val-grp"><td colspan="2">' + grp.title + '</td></tr>';
        for (const [k, lbl] of grp.keys) {
          if (a[k] == null) continue;
          detail += '<tr><td>' + lbl + '</td><td style="text-align:right;color:'
            + aurocColor(a[k]) + ';font-variant-numeric:tabular-nums;">' + a[k].toFixed(3) + '</td></tr>';
        }
      }
      detail += '</table></div></details>';

      html += '<div class="val-card">' + head + chips + detail + '</div>';
    }
    if (!any) {
      html += '<div class="no-fig" style="padding:24px;">No grounding results yet. '
        + 'They appear here as 08_certify.py writes validation.json per seed.</div>';
    }
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="no-fig" style="padding:24px;">Validation render error: '
      + escapeHtml(String((e && e.message) || e)) + '</div>';
  }
}

async function scanDatasets() {
  if (IS_FILE_PROTOCOL && !localFiles) {
    renderLocalPrompt();
    return;
  }

  showLoading(true);
  const progressList = document.getElementById('progressList');
  progressList.innerHTML = '<li class="scanning">Scanning datasets...</li>';

  allData = [];

  // Probe all known datasets for dataset_config.json in parallel
  const configResults = await Promise.all(
    KNOWN_DATASETS.map(async name => ({
      name,
      config: await fetchJson('datasets/' + name + '/dataset_config.json')
    }))
  );

  const foundDatasets = configResults.filter(r => r.config !== null);

  if (localFiles) {
    if (foundDatasets.length > 0) {
      setSourceStatus('Local mode: using selected repo folder.', 'ok');
    } else {
      setSourceStatus('Local mode: no datasets found in the selected folder.', 'warning');
    }
  }

  progressList.querySelector('li').className = 'done';
  progressList.querySelector('li').textContent = 'Found ' + foundDatasets.length + ' datasets';

  for (const { name: dirName, config } of foundDatasets) {
    const li = document.createElement('li');
    li.className = 'scanning';
    li.textContent = 'Scanning ' + (config.dataset_name || dirName) + '...';
    progressList.appendChild(li);

    const ds = {
      dirName: dirName,
      config: config,
      datasetName: config.dataset_name || dirName,
      subjects: config.subjects || [],
      variants: config.variants || {},
      protoNames: config.proto_names || [],
      results: {}
    };

    // For each variant, probe all known models in parallel
    const variants = config.variants || {};
    const variantProbes = Object.entries(variants).map(async ([variantKey, variantDirName]) => {
      const variantPath = 'datasets/' + dirName + '/results/tmin0ms_tmax800ms/' + variantDirName;

      // Probe each model across seed-<N>/ dirs and aggregate.
      const ERPXTTN_FAMILY = KNOWN_MODELS.filter(m => m.startsWith('erpxttn'));
      const modelProbes = await Promise.all(KNOWN_MODELS.map(async modelName => {
        const modelDir = variantPath + '/' + modelName;
        // Probe candidate seeds in parallel.
        const seedResults = (await Promise.all(SEED_CANDIDATES.map(async seed => {
          const seedPath = modelDir + '/seed-' + seed;
          const r = await fetchJson(seedPath + '/results.json');
          return r ? { seed, results: r, path: seedPath } : null;
        }))).filter(Boolean);
        if (seedResults.length === 0) return null;

        // Seed-averaged results object (compatible with the renderers).
        const results = aggregateSeeds(seedResults, EXPECTED_SEEDS(modelName));
        // Figures (if generated) live under the lowest present seed dir.
        const modelPath = seedResults[0].path;
        const modelData = { results: results, figures: {}, basePath: modelPath,
                            seedInfo: results._seedInfo };

        const subjects = config.subjects || [];
        if (ERPXTTN_FAMILY.includes(modelName)) {
          // ERPXTTN-family: aggregate figs + per-subject morphology + TP/TN routing
          const figNames = [
            ...AGGREGATE_FIGS,
            ...subjects.flatMap(s => [
              'fig_morphology_' + s + '.png',
              'fig_tp_tn_routing_' + s + '_highconf.png',
              'fig_tp_tn_routing_' + s + '_median.png'
            ])
          ];
          for (const fn of figNames) {
            modelData.figures[fn] = fileUrl(modelPath + '/' + fn);
          }
        } else {
          // Baselines (EEGNet, xDAWN+RG): morphology figures only
          const figNames = [
            'fig_morphology_aggregate.png',
            ...subjects.map(s => 'fig_morphology_' + s + '.png')
          ];
          for (const fn of figNames) {
            modelData.figures[fn] = fileUrl(modelPath + '/' + fn);
          }
        }

        return { modelName, modelData };
      }));

      const validModels = modelProbes.filter(m => m !== null);
      if (validModels.length > 0) {
        ds.results[variantKey] = {};
        for (const { modelName, modelData } of validModels) {
          ds.results[variantKey][modelName] = modelData;
        }
      }
    });

    await Promise.all(variantProbes);
    allData.push(ds);
    li.className = 'done';
    li.textContent = ds.datasetName;
  }

  showLoading(false);
  document.getElementById('btnRefresh').disabled = false;
  renderAll();
}

document.getElementById('btnRefresh').addEventListener('click', () => {
  if (IS_FILE_PROTOCOL && !localFiles) {
    document.getElementById('btnSelectRepo').click();
    return;
  }
  document.getElementById('btnRefresh').disabled = true;
  scanDatasets();
});

document.getElementById('btnSelectRepo').addEventListener('click', () => {
  if (CAN_PICK_DIRECTORIES) {
    (async () => {
      try {
        setSourceStatus('Local mode: indexing selected repo folder...', null);
        document.getElementById('btnRefresh').disabled = true;
        clearLocalObjectUrls();
        localFiles = await indexRepoHandle(await window.showDirectoryPicker());
        await scanDatasets();
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        setSourceStatus('Local mode: could not read the selected folder.', 'warning');
      }
    })();
    return;
  }

  const picker = document.getElementById('repoPicker');
  picker.value = '';
  picker.click();
});

document.getElementById('repoPicker').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  clearLocalObjectUrls();
  localFiles = indexLocalFiles(files);
  setSourceStatus('Local mode: indexing selected repo folder (fallback picker)...', null);
  document.getElementById('btnRefresh').disabled = true;
  await scanDatasets();
});

/* ── Helpers ── */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function aurocColor(val) {
  if (val == null) return '';
  // Red (0.5) -> Yellow (0.7) -> Green (0.9+)
  const t = Math.max(0, Math.min(1, (val - 0.5) / 0.4));
  const r = Math.round(255 * (1 - t * 0.7));
  const g = Math.round(100 + 155 * t);
  const b = Math.round(60 + 40 * (1 - Math.abs(t - 0.5) * 2));
  return 'rgba(' + r + ',' + g + ',' + b + ',0.25)';
}

function fmt(val, digits) {
  if (val == null) return null;
  return val.toFixed(digits === undefined ? 3 : digits);
}

function getMeanAuroc(modelData) {
  if (!modelData || !modelData.results || !modelData.results.folds) return null;
  const aurocs = modelData.results.folds.map(f => f.test_auroc).filter(v => v != null);
  if (aurocs.length === 0) return null;
  return aurocs.reduce((a, b) => a + b, 0) / aurocs.length;
}

function getMeanBalAcc(modelData) {
  if (!modelData || !modelData.results || !modelData.results.folds) return null;
  const vals = modelData.results.folds.map(f => f.test_bal_acc).filter(v => v != null);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function getSubjectAuroc(modelData, subj) {
  if (!modelData || !modelData.results || !modelData.results.folds) return null;
  const fold = modelData.results.folds.find(f => f.test_subject === subj);
  return fold ? fold.test_auroc : null;
}

function getSubjectBalAcc(modelData, subj) {
  if (!modelData || !modelData.results || !modelData.results.folds) return null;
  const fold = modelData.results.folds.find(f => f.test_subject === subj);
  return fold ? fold.test_bal_acc : null;
}

// Per-subject fusion (two-factor) AUROC — the headline number for ERP-XTTN;
// null for models without a fusion (baselines).
function getSubjectFusion(modelData, subj) {
  if (!modelData || !modelData.results || !modelData.results.folds) return null;
  const fold = modelData.results.folds.find(f => f.test_subject === subj);
  return fold ? fold.two_factor_auroc : null;
}

/* ── Rendering ── */
function renderAll() {
  renderOverview();
  renderFigControls();

}

/* ── Overview ── */
function renderOverview() {
  const container = document.getElementById('overviewContent');
  const filterBar = document.getElementById('filterBar');

  if (allData.length === 0) {
    container.innerHTML = '<p style="color:var(--text-secondary);padding:40px 0;text-align:center;">No datasets with results found.</p>';
    filterBar.innerHTML = '';
    return;
  }

  // Filter bar: All / 3ch / Full
  filterBar.innerHTML = '<label>Variant filter:</label>';
  for (const [label, filter] of [['All', null], ['3ch', '3ch'], ['Full', 'full']]) {
    const btn = document.createElement('button');
    btn.className = 'btn-small' + (filter === null ? ' btn-active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('btn-active'));
      btn.classList.add('btn-active');
      renderOverviewTable(filter);
    });
    filterBar.appendChild(btn);
  }

  renderOverviewTable(null);
}

function classifyVariant(variantKey) {
  if (variantKey === 'full') return 'full';
  return '3ch';
}

function renderOverviewTable(filterCategory) {
  const container = document.getElementById('overviewContent');
  const nModels = KNOWN_MODELS.length;
  const colSpan = 2 + nModels + 1; // Dataset, Variant, models, Time

  // Build rows: one per dataset+variant
  let rows = [];
  for (const ds of allData) {
    for (const vk of Object.keys(ds.results).sort()) {
      if (filterCategory && classifyVariant(vk) !== filterCategory) continue;
      rows.push({ ds, vk, modelMap: ds.results[vk] || {} });
    }
  }

  if (rows.length === 0) {
    container.innerHTML = '<p style="color:var(--text-secondary);padding:40px 0;text-align:center;">No results match the current filter.</p>';
    return;
  }

  let html = '<div class="table-container"><table><thead><tr>';
  html += '<th>Dataset</th><th>Variant</th>';
  for (const m of KNOWN_MODELS) html += '<th>' + (MODEL_DISPLAY[m] || m) + '</th>';
  html += '<th>Time (s)</th></tr></thead><tbody>';

  for (let ri = 0; ri < rows.length; ri++) {
    const { ds, vk, modelMap } = rows[ri];
    const rowId = ds.dirName + '|' + vk;

    // Find best AUROC across models for this row
    let bestAuroc = -1;
    let bestModel = null;
    for (const m of KNOWN_MODELS) {
      const h = headlineAuroc(modelMap[m]?.results);
      if (h != null && h > bestAuroc) {
        bestAuroc = h;
        bestModel = m;
      }
    }

    // Main summary row
    html += '<tr class="clickable" data-row-id="' + escapeHtml(rowId) + '">';
    html += '<td>' + escapeHtml(ds.datasetName) + '</td>';
    html += '<td>' + escapeHtml(vk) + '</td>';
    for (const m of KNOWN_MODELS) {
      const r = modelMap[m]?.results;
      if (r && headlineAuroc(r) != null) {
        const isBest = m === bestModel;
        const si = r._seedInfo;
        let seedBadge = '';
        if (si) {
          const color = si.complete ? 'var(--text-secondary)' : '#ffb74d';
          const tip = 'seeds present: [' + si.seedsPresent.join(', ') + ']'
            + ' (' + si.nSeeds + '/' + si.expectedSeeds + ')'
            + (si.seedMean != null ? '\nper-seed mean ' + fmt(si.seedMean) + ' ± ' + fmt(si.seedSd) : '');
          seedBadge = ' <span title="' + escapeHtml(tip) + '" style="font-size:0.68rem;color:' + color + ';">'
            + si.nSeeds + '/' + si.expectedSeeds + 's' + (si.complete ? '' : ' &#9203;') + '</span>';
        }
        // Fusion is the headline when present (ERP-XTTN); routing shown underneath.
        const hasFusion = r.mean_two_factor != null;
        const head = hasFusion ? r.mean_two_factor : r.mean_auroc;
        const headStd = hasFusion ? r.std_two_factor : r.std_auroc;
        const routingSub = (hasFusion && r.mean_auroc != null)
          ? '<div style="font-size:0.68rem;color:var(--text-secondary);margin-top:2px;">routing ' + fmt(r.mean_auroc) + '</div>'
          : '';
        html += '<td><span class="auroc-cell' + (isBest ? ' cell-best' : '') + '" style="background:' + aurocColor(head) + '">' + fmt(head) + ' &plusmn; ' + fmt(headStd) + '</span>' + seedBadge + routingSub + '</td>';
      } else {
        html += '<td><span class="cell-missing">&mdash;</span></td>';
      }
    }
    // Time column
    const formatTime = (s) => {
      if (s == null) return '';
      if (s < 3600) return Math.round(s / 60) + 'min';
      return (s / 3600).toFixed(1) + 'hr';
    };
    const times = KNOWN_MODELS.map(m => {
      const e = modelMap[m]?.results?.elapsed_seconds;
      return e != null ? formatTime(e) : '';
    }).filter(Boolean);
    html += '<td style="color:var(--text-secondary);font-size:0.78rem">' + (times.length ? times.join(' / ') : '&mdash;') + '</td>';
    html += '</tr>';

    // Expandable per-subject detail row
    html += '<tr class="detail-row" data-detail-for="' + escapeHtml(rowId) + '" style="display:none;"><td colspan="' + colSpan + '"><div class="detail-inner"><table><thead><tr><th>Subject</th>';
    for (const m of KNOWN_MODELS) html += '<th>' + (MODEL_DISPLAY[m] || m) + '</th>';
    html += '</tr></thead><tbody>';

    const subjects = ds.subjects || [];
    for (const sub of subjects) {
      html += '<tr><td>' + escapeHtml(sub) + '</td>';
      // Headline per subject = fusion (two-factor) when present, else routing —
      // best cell chosen on that headline number, like the main rows.
      let bestSubVal = -1;
      let bestSubModel = null;
      for (const m of KNOWN_MODELS) {
        const fusion = getSubjectFusion(modelMap[m], sub);
        const head = fusion != null ? fusion : getSubjectAuroc(modelMap[m], sub);
        if (head != null && head > bestSubVal) { bestSubVal = head; bestSubModel = m; }
      }
      for (const m of KNOWN_MODELS) {
        const routing = getSubjectAuroc(modelMap[m], sub);
        const fusion = getSubjectFusion(modelMap[m], sub);
        const head = fusion != null ? fusion : routing;
        if (head != null) {
          const isBest = m === bestSubModel;
          // Fusion headline with routing beneath (mirrors the overview rows).
          const routingSub = (fusion != null && routing != null)
            ? '<div style="font-size:0.68rem;color:var(--text-secondary);margin-top:2px;">routing ' + fmt(routing) + '</div>'
            : '';
          html += '<td><span class="auroc-cell' + (isBest ? ' cell-best' : '') + '" style="background:' + aurocColor(head) + '">' + fmt(head) + '</span>' + routingSub + '</td>';
        } else {
          html += '<td><span class="cell-missing">&mdash;</span></td>';
        }
      }
      html += '</tr>';
    }
    html += '</tbody></table></div></td></tr>';
  }

  html += '</tbody></table></div>';
  container.innerHTML = html;

  // Click handlers for expanding detail rows
  container.querySelectorAll('tr.clickable[data-row-id]').forEach(tr => {
    tr.addEventListener('click', () => {
      const rowId = tr.dataset.rowId;
      const detail = container.querySelector('tr.detail-row[data-detail-for="' + CSS.escape(rowId) + '"]');
      if (detail) {
        detail.style.display = detail.style.display === 'none' ? '' : 'none';
      }
    });
  });
}

/* ── Figures Tab ── */
function renderFigControls() {
  const container = document.getElementById('figControls');
  if (allData.length === 0) {
    container.innerHTML = '';
    document.getElementById('figContent').innerHTML = '';
    return;
  }

  let html = '';

  // Dataset selector
  html += '<div class="control-group"><label>Dataset</label><select id="figDataset">';
  for (const ds of allData) {
    html += '<option value="' + ds.dirName + '">' + escapeHtml(ds.datasetName) + '</option>';
  }
  html += '</select></div>';

  // Variant selector
  html += '<div class="control-group"><label>Variant</label><select id="figVariant"></select></div>';

  // Model selector
  html += '<div class="control-group"><label>Model</label><select id="figModel"></select></div>';

  // Figure type tabs
  html += '<div class="control-group"><label>View</label><div id="figViewBtns" style="display:flex;gap:4px;">';
  html += '<button class="btn-small btn-active" data-view="aggregate">Aggregate</button>';
  html += '<button class="btn-small" data-view="per-subject">Per Subject</button>';
  html += '</div></div>';

  container.innerHTML = html;

  const figDs = document.getElementById('figDataset');
  const figVar = document.getElementById('figVariant');
  const figModel = document.getElementById('figModel');

  function updateVariants() {
    const ds = allData.find(d => d.dirName === figDs.value);
    if (!ds) return;
    const variants = Object.keys(ds.results).sort();
    figVar.innerHTML = variants.map(v => '<option value="' + v + '">' + v + '</option>').join('');
    updateModels();
  }

  function updateModels() {
    const ds = allData.find(d => d.dirName === figDs.value);
    if (!ds) return;
    const vk = figVar.value;
    const modelMap = ds.results[vk] || {};
    const models = KNOWN_MODELS.filter(m => modelMap[m]);
    figModel.innerHTML = models.map(m => '<option value="' + m + '">' + (MODEL_DISPLAY[m] || m) + '</option>').join('');
    renderFigures();
  }

  figDs.addEventListener('change', updateVariants);
  figVar.addEventListener('change', updateModels);
  figModel.addEventListener('change', renderFigures);

  document.getElementById('figViewBtns').addEventListener('click', (e) => {
    if (e.target.dataset.view) {
      document.querySelectorAll('#figViewBtns button').forEach(b => b.classList.remove('btn-active'));
      e.target.classList.add('btn-active');
      renderFigures();
    }
  });

  updateVariants();
}

function renderFigures() {
  const figDs = document.getElementById('figDataset');
  const figVar = document.getElementById('figVariant');
  const figModel = document.getElementById('figModel');
  const container = document.getElementById('figContent');

  if (!figDs || !figVar || !figModel) return;

  const ds = allData.find(d => d.dirName === figDs.value);
  if (!ds) { container.innerHTML = ''; return; }

  const vk = figVar.value;
  const model = figModel.value;
  const modelData = ds.results[vk] && ds.results[vk][model];

  if (!modelData) {
    container.innerHTML = '<div class="no-fig">No data for this selection.</div>';
    return;
  }

  const activeView = document.querySelector('#figViewBtns button.btn-active');
  const view = activeView ? activeView.dataset.view : 'aggregate';

  if (view === 'aggregate') {
    renderAggregateFigs(ds, vk, model, modelData, container);
  } else {
    renderPerSubjectFigs(ds, vk, model, modelData, container);
  }
}

function renderAggregateFigs(ds, vk, model, modelData, container) {
  let html = '<div class="fig-grid">';
  let found = 0;

  for (const figName of AGGREGATE_FIGS) {
    const url = modelData.figures[figName];
    if (!url) continue;
    found++;
    html += '<div class="fig-card" data-fig-url="' + escapeHtml(url) + '">';
    html += '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(figName) + '" loading="lazy">';
    html += '<div class="fig-label">' + escapeHtml(figName.replace('fig_', '').replace('.png', '')) + '</div>';
    html += '</div>';
  }

  html += '</div>';

  if (found === 0) {
    html = '<div class="no-fig">No aggregate figures available for this model.</div>';
  }

  container.innerHTML = html;

  // Click-to-lightbox via event delegation
  container.querySelectorAll('.fig-card[data-fig-url]').forEach(card => {
    card.addEventListener('click', () => {
      openLightbox(card.dataset.figUrl);
    });
  });
}

function renderPerSubjectFigs(ds, vk, model, modelData, container) {
  let html = '';
  const subjects = ds.subjects;

  if (subjects.length === 0) {
    container.innerHTML = '<div class="no-fig">No subjects defined for this dataset.</div>';
    return;
  }

  for (const subj of subjects) {
    const morphFig = 'fig_morphology_' + subj + '.png';
    const medianFig = 'fig_tp_tn_routing_' + subj + '_median.png';
    const highconfFig = 'fig_tp_tn_routing_' + subj + '_highconf.png';
    const morphUrl = modelData.figures[morphFig];
    const medianUrl = modelData.figures[medianFig];
    const highconfUrl = modelData.figures[highconfFig];

    if (!morphUrl && !medianUrl && !highconfUrl) continue;

    const auroc = getSubjectAuroc(modelData, subj);
    const aurocStr = auroc != null ? ' (AUROC: ' + fmt(auroc) + ')' : '';

    html += '<h4 style="margin:16px 0 8px;color:var(--text-primary);">' + escapeHtml(subj) + escapeHtml(aurocStr) + '</h4>';

    if (morphUrl) {
      html += '<div class="fig-grid" style="grid-template-columns:1fr;margin-bottom:12px;">';
      html += '<div class="fig-card" data-fig-url="' + escapeHtml(morphUrl) + '">';
      html += '<img src="' + escapeHtml(morphUrl) + '" alt="' + escapeHtml(subj + ' morphology') + '" loading="lazy">';

  let html = '';

  if (subj) {

    let highHtml = '';

      const highFig = 'fig_tp_tn_routing_' + subj + '_highconf.png';

      const highUrl = md.figures[highFig];
      const medUrl = md.figures[medFig];

        morphHtml += '<div class="compare-panel">';

        morphHtml += '</div>';
      }
      if (highUrl) {
        highHtml += '<div class="compare-panel">';
        highHtml += '<div class="panel-header">' + (MODEL_DISPLAY[m] || m) + ' - ' + escapeHtml(subj) + ' (high conf)</div>';
        highHtml += '<img src="' + escapeHtml(highUrl) + '" alt="' + escapeHtml(m + ' ' + subj + ' high') + '" loading="lazy" data-fig-url="' + escapeHtml(highUrl) + '" class="compare-img">';
        highHtml += '</div>';
      }
      if (medUrl) {
        medHtml += '<div class="compare-panel">';
        medHtml += '<div class="panel-header">' + (MODEL_DISPLAY[m] || m) + ' - ' + escapeHtml(subj) + ' (median)</div>';
        medHtml += '<img src="' + escapeHtml(medUrl) + '" alt="' + escapeHtml(m + ' ' + subj + ' median') + '" loading="lazy" data-fig-url="' + escapeHtml(medUrl) + '" class="compare-img">';
        medHtml += '</div>';

    if (medHtml) html += '<div class="compare-grid">' + medHtml + '</div>';
  } else {
    html += '<div class="compare-grid">';

      const md = modelMap[m];
      if (!md) continue;
      const url = md.figures[figName];

      html += '<div class="panel-header">' + (MODEL_DISPLAY[m] || m) + '</div>';

    });

}

function spearmanRho(xs, ys) {
  const pairs = [];
  for (let i = 0; i < xs.length; i++) {
    if (xs[i] != null && ys[i] != null && isFinite(xs[i]) && isFinite(ys[i])) {
      pairs.push([xs[i], ys[i]]);
    }
  }
  if (pairs.length < 3) return {rho: null, n: pairs.length};
  const n = pairs.length;
  // Compute ranks with average-tie handling
  function rank(vals) {
    const idx = vals.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const ranks = new Array(vals.length);
    let i = 0;
    while (i < idx.length) {
      let j = i;
      while (j + 1 < idx.length && idx[j+1][0] === idx[i][0]) j++;
      const avg = (i + j) / 2 + 1;
      for (let k = i; k <= j; k++) ranks[idx[k][1]] = avg;
      i = j + 1;
    }
    return ranks;
  }
  const rx = rank(pairs.map(p => p[0]));
  const ry = rank(pairs.map(p => p[1]));
  const mx = rx.reduce((a, b) => a + b, 0) / n;
  const my = ry.reduce((a, b) => a + b, 0) / n;
  let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) {
    num += (rx[i] - mx) * (ry[i] - my);
    dx += (rx[i] - mx) ** 2;
    dy += (ry[i] - my) ** 2;
  }
  const denom = Math.sqrt(dx * dy);
  return {rho: denom > 0 ? num / denom : null, n};
}

function filterCombos(data, variantFilter) {
  const combos = Object.entries(data.combos).map(([key, entry]) => ({key, ...entry}));
  if (variantFilter === '3ch') return combos.filter(c => c.variant_key !== 'full');
  if (variantFilter === 'full') return combos.filter(c => c.variant_key === 'full');
  return combos;
}

  const vBtn = document.querySelector('#analVarBtns button.btn-active');

function renderAnalysisTable(combos, descriptions) {
  // Compute column-wise min/max for color shading
  const numCols = ANALYSIS_COLUMNS.filter(c => c.isNum);
  const colStats = {};
  for (const col of numCols) {
    const vals = combos.map(c => col.extractor(c)).filter(v => v != null && isFinite(v));
    if (vals.length) colStats[col.id] = {min: Math.min(...vals), max: Math.max(...vals)};
  }
  let html = '<h3 style="margin:12px 0;color:var(--accent);">Metrics by dataset × variant</h3>';
  html += '<div class="table-container"><table><thead><tr>';
  for (const col of ANALYSIS_COLUMNS) {
    const desc = col.metricKey && descriptions && descriptions[col.metricKey] ? descriptions[col.metricKey] : '';
    const title = desc ? ' title="' + escapeHtml(desc) + '"' : '';
    html += '<th' + title + '>' + escapeHtml(col.label) + '</th>';
  }
  html += '</tr></thead><tbody>';
  for (const c of combos) {
    html += '<tr>';
    for (const col of ANALYSIS_COLUMNS) {
      const v = col.extractor(c);
      const s = col.secondary ? col.secondary(c) : null;
      let txt;
      if (col.fmtFn) txt = col.fmtFn(v, s);
      else if (v == null) txt = '<span class="cell-missing">—</span>';
      else if (col.isNum) txt = Number(v).toFixed(col.digits != null ? col.digits : 3);
      else txt = escapeHtml(String(v));
      html += '<td>' + txt + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

  html += '<div style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px;">Plots are grouped by metric, with one panel per baseline (EEGNet, EEG-Deformer, EPMN, xDAWN+RG). Each point is a (dataset, variant) — <span style="color:#4fc3f7;">● 3-channel preset</span>, <span style="color:#ffb74d;">● full montage</span>. Spearman ρ is reported per-variant (n=9 each) to avoid the same x value contributing twice for montage-invariant metrics. n is low; treat ρ as a trend indicator, not a significance test. Hover a point for details.</div>';

function renderSingleScatter({title, xLabel, yLabel, pts}) {
  const valid = pts.filter(p => p.x != null && p.y != null && isFinite(p.x) && isFinite(p.y));
  const W = 440, H = 340;
  const M = {top: 52, right: 16, bottom: 48, left: 64};
  if (valid.length < 2) {
    return '<div class="compare-panel" style="padding:12px;">' +
      '<div style="font-weight:600;color:var(--accent);margin-bottom:4px;">' + escapeHtml(title) + '</div>' +
      '<div class="no-fig" style="min-height:120px;">Not enough data to plot.</div></div>';
  }
  const xs = valid.map(p => p.x), ys = valid.map(p => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xPad = (xMax - xMin) * 0.08 || 0.05;
  const yPad = (yMax - yMin) * 0.08 || 0.05;
  const x0 = xMin - xPad, x1 = xMax + xPad;
  const y0 = yMin - yPad, y1 = yMax + yPad;
  const sx = v => M.left + ((v - x0) / (x1 - x0)) * (W - M.left - M.right);
  const sy = v => H - M.bottom - ((v - y0) / (y1 - y0)) * (H - M.top - M.bottom);
  const rho = spearmanRho(xs, ys);

  // Axes + grid
  const ticks = (a, b) => {
    const range = b - a;
    const step = Math.pow(10, Math.floor(Math.log10(range))) / 2;
    const out = [];
    for (let t = Math.ceil(a / step) * step; t <= b; t += step) out.push(t);
    return out.slice(0, 6);
  };
  let svg = '<svg width="' + W + '" height="' + H + '" style="background:#0f1528;border-radius:6px;">';
  // Grid
  for (const t of ticks(x0, x1)) {
    svg += '<line x1="' + sx(t) + '" y1="' + M.top + '" x2="' + sx(t) + '" y2="' + (H - M.bottom) + '" stroke="#2a3a5e" stroke-dasharray="2,3"/>';
    svg += '<text x="' + sx(t) + '" y="' + (H - M.bottom + 14) + '" fill="#a0a0b0" font-size="10" text-anchor="middle">' + t.toFixed(2) + '</text>';
  }
  for (const t of ticks(y0, y1)) {
    svg += '<line x1="' + M.left + '" y1="' + sy(t) + '" x2="' + (W - M.right) + '" y2="' + sy(t) + '" stroke="#2a3a5e" stroke-dasharray="2,3"/>';
    svg += '<text x="' + (M.left - 6) + '" y="' + (sy(t) + 3) + '" fill="#a0a0b0" font-size="10" text-anchor="end">' + t.toFixed(2) + '</text>';
  }
  // y=0 reference line
  if (y0 < 0 && y1 > 0) {
    svg += '<line x1="' + M.left + '" y1="' + sy(0) + '" x2="' + (W - M.right) + '" y2="' + sy(0) + '" stroke="#666" stroke-width="1"/>';
  }
  // Points — color 3ch vs full differently if variant info present
  for (const p of valid) {
    const color = p.isFull ? '#ffb74d' : '#4fc3f7';
    svg += '<circle cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r="5" fill="' + color + '" stroke="#fff" stroke-width="1" class="scatter-pt" data-label="' + escapeHtml(p.label + ' — x=' + p.x.toFixed(3) + ', y=' + p.y.toFixed(3)) + '"/>';
  }
  // Axis labels
  svg += '<text x="' + (M.left + (W - M.left - M.right) / 2) + '" y="' + (H - 8) + '" fill="#e0e0e0" font-size="11" text-anchor="middle">' + escapeHtml(xLabel) + '</text>';
  svg += '<text x="' + 14 + '" y="' + (M.top + (H - M.top - M.bottom) / 2) + '" fill="#e0e0e0" font-size="11" text-anchor="middle" transform="rotate(-90 14,' + (M.top + (H - M.top - M.bottom) / 2) + ')">' + escapeHtml(yLabel) + '</text>';
  // Title
  svg += '<text x="' + (W / 2) + '" y="16" fill="#4fc3f7" font-size="13" font-weight="600" text-anchor="middle">' + escapeHtml(title) + '</text>';

  // Spearman ρ per variant subset
  const xs3 = valid.filter(p => !p.isFull).map(p => p.x);
  const ys3 = valid.filter(p => !p.isFull).map(p => p.y);
  const xsf = valid.filter(p => p.isFull).map(p => p.x);
  const ysf = valid.filter(p => p.isFull).map(p => p.y);
  const rho3 = spearmanRho(xs3, ys3);
  const rhoF = spearmanRho(xsf, ysf);
  const rho3Str = rho3.rho != null ? rho3.rho.toFixed(2) : 'N/A';
  const rhoFStr = rhoF.rho != null ? rhoF.rho.toFixed(2) : 'N/A';
  svg += '<text x="8" y="34" fill="#4fc3f7" font-size="11" font-weight="600" text-anchor="start">ρ 3ch = ' + rho3Str + ' (n=' + rho3.n + ')</text>';
  svg += '<text x="' + (W - M.right) + '" y="34" fill="#ffb74d" font-size="11" font-weight="600" text-anchor="end">ρ full = ' + rhoFStr + ' (n=' + rhoF.n + ')</text>';
  svg += '</svg>';
  return '<div class="compare-panel" style="padding:8px;">' + svg + '<div class="scatter-hover" style="color:var(--text-secondary);font-size:0.8rem;min-height:16px;margin-top:4px;"></div></div>';
}

function attachAnalysisScatterHovers(container) {
  container.querySelectorAll('.scatter-pt').forEach(pt => {
    const panel = pt.closest('.compare-panel');
    const hover = panel ? panel.querySelector('.scatter-hover') : null;
    pt.addEventListener('mouseenter', () => {
      if (hover) hover.textContent = pt.dataset.label;
      pt.setAttribute('r', '7');
    });
    pt.addEventListener('mouseleave', () => {
      if (hover) hover.textContent = '';
      pt.setAttribute('r', '5');
    });
  });
}

function renderAnalysisCorrBars(combos) {
  // One grouped bar chart: TP↔FP and TP↔TN per dataset with CI bars.
  const W = 920, rowH = 22, headerH = 46;
  const M = {top: headerH, right: 24, bottom: 32, left: 260};
  const H = M.top + M.bottom + combos.length * rowH;
  const x0 = -1, x1 = 1;
  const sx = v => M.left + ((v - x0) / (x1 - x0)) * (W - M.left - M.right);

  let html = '<h3 style="margin:20px 0 8px;color:var(--accent);">TP↔FP vs TP↔TN correlation (mean across subjects, 95% bootstrap CI)</h3>';
  html += '<div style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px;">Pearson r between class-conditioned grand-mean waveforms at each dataset&#39;s detection channel. TP↔FP much greater than TP↔TN across datasets would support the claim that the model classifies by waveform morphology (its false alarms look like its hits).</div>';
  let svg = '<svg width="' + W + '" height="' + H + '" style="background:#0f1528;border-radius:6px;">';
  // Axis
  for (const t of [-1, -0.5, 0, 0.5, 1]) {
    svg += '<line x1="' + sx(t) + '" y1="' + M.top + '" x2="' + sx(t) + '" y2="' + (H - M.bottom) + '" stroke="#2a3a5e" stroke-dasharray="2,3"/>';
    svg += '<text x="' + sx(t) + '" y="' + (H - M.bottom + 16) + '" fill="#a0a0b0" font-size="10" text-anchor="middle">' + t.toFixed(1) + '</text>';
  }
  // Zero line
  svg += '<line x1="' + sx(0) + '" y1="' + M.top + '" x2="' + sx(0) + '" y2="' + (H - M.bottom) + '" stroke="#666" stroke-width="1"/>';
  // Legend
  svg += '<rect x="' + M.left + '" y="12" width="12" height="12" fill="#66bb6a"/><text x="' + (M.left + 18) + '" y="22" fill="#e0e0e0" font-size="11">TP↔FP</text>';
  svg += '<rect x="' + (M.left + 90) + '" y="12" width="12" height="12" fill="#e57373"/><text x="' + (M.left + 108) + '" y="22" fill="#e0e0e0" font-size="11">TP↔TN</text>';
  svg += '<text x="' + (W - M.right) + '" y="22" fill="#a0a0b0" font-size="10" text-anchor="end">r (Pearson)</text>';
  // Rows
  combos.forEach((c, i) => {
    const yCenter = M.top + i * rowH + rowH / 2;
    const rowLabel = (c.dataset_name || c.dataset_dir) + ' (' + c.variant_key + ')';
    svg += '<text x="' + (M.left - 8) + '" y="' + (yCenter + 3) + '" fill="#e0e0e0" font-size="10" text-anchor="end">' + escapeHtml(rowLabel) + '</text>';
    // Horizontal row separator
    svg += '<line x1="' + M.left + '" y1="' + (yCenter + rowH / 2) + '" x2="' + (W - M.right) + '" y2="' + (yCenter + rowH / 2) + '" stroke="#1a2744"/>';
    const ct = c.tp_fp_tn_corr;
    if (!ct) return;
    const barH = 7;
    // TP↔FP
    if (ct.tp_fp && ct.tp_fp.mean_r != null) {
      const m = ct.tp_fp.mean_r;
      svg += '<line x1="' + sx(ct.tp_fp.ci_low) + '" y1="' + (yCenter - 5) + '" x2="' + sx(ct.tp_fp.ci_high) + '" y2="' + (yCenter - 5) + '" stroke="#66bb6a" stroke-width="2" stroke-linecap="round"/>';
      svg += '<circle cx="' + sx(m) + '" cy="' + (yCenter - 5) + '" r="4" fill="#66bb6a" stroke="#fff" stroke-width="1"/>';
      svg += '<title>TP↔FP r = ' + m.toFixed(3) + '  [' + ct.tp_fp.ci_low.toFixed(2) + ', ' + ct.tp_fp.ci_high.toFixed(2) + ']</title>';
    }
    // TP↔TN
    if (ct.tp_tn && ct.tp_tn.mean_r != null) {
      const m = ct.tp_tn.mean_r;
      svg += '<line x1="' + sx(ct.tp_tn.ci_low) + '" y1="' + (yCenter + 5) + '" x2="' + sx(ct.tp_tn.ci_high) + '" y2="' + (yCenter + 5) + '" stroke="#e57373" stroke-width="2" stroke-linecap="round"/>';
      svg += '<circle cx="' + sx(m) + '" cy="' + (yCenter + 5) + '" r="4" fill="#e57373" stroke="#fff" stroke-width="1"/>';
    }
  });
  svg += '</svg>';
  html += '<div class="compare-panel" style="padding:8px;">' + svg + '</div>';
  return html;
}

function renderAnalysisLegend(descriptions) {
  const order = ['tax', 'class_balance_minority', 'k_stats', 'proto_stability', 'snr_proxy', 'attention_entropy', 'routing_discriminability', 'auroc', 'latency_variability', 'tp_fp_tn_corr'];
  const labels = {
    tax: 'Interpretability tax',
    class_balance_minority: 'Class balance',
    k_stats: 'K statistics (K_mode, K_consistency)',
    proto_stability: 'Prototype stability',
    snr_proxy: 'GA diff-wave SNR proxy',
    attention_entropy: 'Attention entropy',
    routing_discriminability: 'Routing discriminability',
    auroc: 'AUROC & AUROC SD',
    latency_variability: 'Latency variability',
    tp_fp_tn_corr: 'TP↔FP / TP↔TN Pearson r',
  };
  let html = '<h3 style="margin:20px 0 8px;color:var(--accent);">Metric definitions</h3>';
  html += '<dl style="color:var(--text-primary);font-size:0.88rem;line-height:1.5;">';
  for (const k of order) {
    if (!descriptions[k]) continue;
    html += '<dt style="font-weight:600;margin-top:10px;color:var(--accent);">' + escapeHtml(labels[k] || k) + '</dt>';
    html += '<dd style="margin-left:16px;color:var(--text-secondary);">' + escapeHtml(descriptions[k]) + '</dd>';
  }
  html += '</dl>';
  return html;
}
